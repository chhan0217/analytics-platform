name: CI — KMP SDK

on:
  pull_request:
    paths:
      - 'sdk/analytics-kmp/**'
      - 'sdk/analytics-compose/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [develop, main]
    paths:
      - 'sdk/analytics-kmp/**'
      - 'sdk/analytics-compose/**'

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-sdk-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-sdk-

      - name: KMP SDK + Compose 어댑터 빌드 (클린)
        run: ./gradlew clean :sdk:analytics-kmp:build :sdk:analytics-compose:build
