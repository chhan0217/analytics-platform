name: CI — Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: analytics
      DB_USER: analytics
      DB_PASSWORD: analytics_local

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 + 테스트 + 코드 품질
        run: ./gradlew :backend:build
